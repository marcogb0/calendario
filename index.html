<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario · Tareas y Horario (Nube)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121212;
    --bg-panel: #1a1a1a;
    --bg-elevated: #212121;
    --bg-hover: #262626;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.14);
    --text: #edecea;
    --text-secondary: #9a9a9a;
    --text-tertiary: #636363;
    --accent: #7c8cf8;
    --accent-soft: rgba(124,140,248,0.16);
    --amber: #f2b84b;
    --amber-soft: rgba(242,184,75,0.18);
    --danger: #f0788a;
    --danger-soft: rgba(240,120,138,0.15);
    --success: #4ade80;
    --success-soft: rgba(74,222,128,0.15);
    --radius-lg: 16px;
    --radius-md: 10px;
    --radius-sm: 7px;
    --shadow: 0 20px 45px rgba(0,0,0,0.45);
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; }
  button, input, select{ font-family: inherit; }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-track{ background: transparent; }
  ::-webkit-scrollbar-thumb{ background: var(--border-strong); border-radius: 4px; }

  /* Topbar */
  .topbar{ position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; background: rgba(18,18,18,0.82); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .brand{ display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  .cloud-status { font-size: 11.5px; padding: 4px 10px; border-radius: 12px; background: rgba(255,255,255,0.05); color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
  .status-dot.online { background: var(--success); }

  /* Banner Próxima Clase */
  .next-class-banner { background: linear-gradient(90deg, rgba(124,140,248,0.12) 0%, rgba(59,130,246,0.12) 100%); border: 1px solid rgba(124,140,248,0.25); border-radius: var(--radius-md); padding: 12px 18px; margin: 20px 0 0; display: flex; align-items: center; gap: 12px; font-size: 13.5px; }
  .next-class-text strong { color: var(--accent); }

  /* Main & Grid */
  main{ max-width: 1200px; margin: 0 auto; padding: 0 24px 64px; }
  .calendar-nav{ display: flex; align-items: center; justify-content: space-between; margin: 24px 0 18px; flex-wrap: wrap; gap: 12px; }
  .month-title{ font-size: 21px; font-weight: 700; text-transform: capitalize; }
  .nav-controls{ display: flex; align-items: center; gap: 6px; }

  .view-selector { display: flex; background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px; }
  .view-btn { background: transparent; border: none; color: var(--text-secondary); padding: 5px 12px; font-size: 12.5px; font-weight: 600; border-radius: 5px; cursor: pointer; }
  .view-btn.active { background: var(--bg-hover); color: var(--text); }

  .icon-btn, .text-btn{ background: transparent; border: 1px solid var(--border); color: var(--text-secondary); border-radius: var(--radius-sm); cursor: pointer; }
  .icon-btn{ width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 17px; }
  .text-btn{ padding: 0 13px; height: 32px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }

  .calendar-card{ background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 24px; }
  .weekday-row{ display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; padding-bottom: 12px; }
  .weekday-row span{ font-size: 11.5px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; }
  .days-grid{ display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

  .day-cell{ position: relative; background: transparent; border: none; border-radius: var(--radius-md); padding: 8px; min-height: 66px; display: flex; flex-direction: column; align-items: flex-start; cursor: pointer; color: var(--text); }
  .day-cell:hover{ background: var(--bg-hover); }
  .day-cell.other-month{ color: var(--text-tertiary); }
  .day-num{ font-size: 13px; font-weight: 500; width: 25px; height: 25px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  .day-cell.is-today .day-num{ background: var(--accent); color: #101014; font-weight: 700; }

  .task-dot{ position: absolute; bottom: 10px; left: 13px; width: 6px; height: 6px; border-radius: 50%; }
  .task-dot.pending{ background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
  .task-dot.done{ background: var(--text-tertiary); }

  .dashboard-grid{ display: grid; grid-template-columns: 3fr 2fr; gap: 24px; }
  .dashboard-card{ background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; }
  .card-header-flex { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .dashboard-card h2{ font-size: 17px; margin: 0; display: flex; align-items: center; gap: 8px; }

  .schedule-table{ width: 100%; border-collapse: collapse; font-size: 13px; }
  .schedule-table th{ padding-bottom: 10px; color: var(--text-secondary); font-size: 11.5px; border-bottom: 1px solid var(--border-strong); }
  .schedule-table td{ padding: 5px; border-bottom: 1px solid var(--border); text-align: center; }
  .time-cell{ color: var(--text-tertiary); font-size: 11.5px; }

  .subject-cell{ display: flex; flex-direction: column; gap: 3px; padding: 3px; border-radius: 8px; border: 2px solid transparent; }
  .subject-cell.current-class { border-color: #3b82f6; background: rgba(59, 130, 246, 0.18); }
  .subject-input{ width: 100%; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px; padding: 7px 6px; color: var(--text); font-size: 12.5px; text-align: center; outline: none; }
  .room-input{ font-size: 10.5px; color: var(--text-secondary); }

  .priority-task-list{ display: flex; flex-direction: column; gap: 10px; }
  .priority-item{ border-left: 4px solid transparent; padding: 12px 14px; border-radius: var(--radius-sm); cursor: pointer; }
  .urgency-high { border-left-color: var(--danger); background: var(--danger-soft); }
  .urgency-medium { border-left-color: var(--amber); background: var(--amber-soft); }
  .urgency-normal { border-left-color: var(--accent); background: var(--accent-soft); }
  .urgency-low { border-left-color: var(--success); background: var(--success-soft); }

  .type-badge { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 12px; text-transform: uppercase; }
  .type-examen { background: rgba(240, 120, 138, 0.25); color: var(--danger); }
  .type-entrega { background: rgba(242, 184, 75, 0.25); color: var(--amber); }
  .type-ejercicio { background: rgba(74, 222, 128, 0.25); color: var(--success); }

  /* Modales */
  .modal-overlay{ position: fixed; inset: 0; background: rgba(0,0,0,0.55); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000; opacity: 0; visibility: hidden; transition: opacity .18s; }
  .modal-overlay.open{ opacity: 1; visibility: visible; }
  .modal{ background: var(--bg-panel); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); width: 100%; max-width: 440px; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: 85vh; }
  .modal-header{ display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); }
  .modal-close{ background: transparent; border: none; color: var(--text-secondary); font-size: 15px; cursor: pointer; }
  .modal-body{ padding: 16px 20px 20px; overflow-y: auto; }

  .task-list{ display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; max-height: 320px; overflow-y: auto; }
  .task-item{ display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--bg-elevated); }
  .task-row-top{ display: flex; align-items: center; gap: 10px; }
  .task-text{ flex: 1; font-size: 13.5px; }
  .task-delete{ background: transparent; border: none; color: var(--text-tertiary); cursor: pointer; }
  .task-form{ display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); padding-top: 12px; }
  .task-form-row{ display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field{ display: flex; flex-direction: column; gap: 4px; }
  .field label{ font-size: 10.5px; color: var(--text-tertiary); text-transform: uppercase; }
  input, select{ background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; color: var(--text); }
  .btn-primary{ background: var(--accent); color: #101014; border: none; border-radius: var(--radius-sm); padding: 11px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span>Calendario</span>
    </div>
    <div class="topbar-actions">
      <div class="cloud-status">
        <span class="status-dot" id="cloudDot"></span>
        <span id="cloudStatusText">Conectando nube...</span>
      </div>
      <button class="text-btn" id="openCampusBtn">🌐 Campus Virtual</button>
    </div>
  </header>

  <main>
    <div class="next-class-banner" id="nextClassBanner">
      <span class="next-class-icon">🔔</span>
      <span class="next-class-text" id="nextClassText">Cargando horario...</span>
    </div>

    <section class="calendar-nav">
      <div class="month-title" id="monthTitle">Mes Año</div>
      <div class="nav-controls">
        <div class="view-selector">
          <button class="view-btn active" id="viewMonthBtn">Mes</button>
          <button class="view-btn" id="viewWeekBtn">Semana</button>
        </div>
        <button class="text-btn" id="todayBtn">Hoy</button>
        <button class="icon-btn" id="prevBtn">‹</button>
        <button class="icon-btn" id="nextBtn">›</button>
      </div>
    </section>

    <section class="calendar-card">
      <div class="weekday-row">
        <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
      </div>
      <div class="days-grid" id="daysGrid"></div>
    </section>

    <section class="dashboard-grid">
      <div class="dashboard-card">
        <h2>Horario</h2>
        <div class="table-responsive">
          <table class="schedule-table">
            <thead>
              <tr>
                <th>Hora</th><th>Lunes</th><th>Martes</th><th>Miércoles</th><th>Jueves</th><th>Viernes</th>
              </tr>
            </thead>
            <tbody id="scheduleBody"></tbody>
          </table>
        </div>
      </div>

      <div class="dashboard-card">
        <div class="card-header-flex">
          <h2>Tareas</h2>
          <select id="priorityFilter">
            <option value="all">Ver todas</option>
            <option value="pending" selected>Solo pendientes</option>
            <option value="examen">🔴 Exámenes</option>
            <option value="entrega">🟡 Entregas</option>
            <option value="ejercicio">🟢 Ejercicios</option>
          </select>
        </div>
        <div class="priority-task-list" id="priorityTaskList"></div>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="dayModalOverlay">
    <div class="modal" id="dayModal">
      <div class="modal-header">
        <h2 id="dayModalTitle">Fecha</h2>
        <button class="modal-close" id="dayModalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="task-list" id="taskList"></div>
        <div class="task-form">
          <div class="field">
            <label>Tarea</label>
            <input type="text" id="taskInput" placeholder="¿Qué tienes que hacer?">
          </div>
          <div class="task-form-row">
            <div class="field">
              <label>Tipo</label>
              <select id="taskType">
                <option value="ninguno">Normal</option>
                <option value="examen">Examen</option>
                <option value="entrega">Entrega</option>
                <option value="ejercicio">Ejercicio</option>
              </select>
            </div>
            <div class="field">
              <label>Asignatura</label>
              <input type="text" id="taskSubject" placeholder="Opcional">
            </div>
          </div>
          <button class="btn-primary" id="addTaskBtn">Añadir tarea</button>
        </div>
      </div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBNyIn52mAtq8pP-M7e-9hQj0v4aHh1LBo",
    authDomain: "micalendario-c2153.firebaseapp.com",
    projectId: "micalendario-c2153",
    storageBucket: "micalendario-c2153.firebasestorage.app",
    messagingSenderId: "1098695844426",
    appId: "1:1098695844426:web:6e6f437c3ed03f7e0edec2"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.cloudData = { tasks: {}, schedule: {}, campus: {} };
  const docRef = doc(db, "app_data", "mi_calendario");

  // Variables de Estado de la Aplicación
  let today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth();
  let currentMode = "month";
  let selectedWeekDate = new Date(today);
  let selectedDateKey = null;

  const MONTH_NAMES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const PERIODS = [
    { start: "08:15", end: "09:45" },
    { start: "09:45", end: "11:15" },
    { start: "11:35", end: "13:05" },
    { start: "13:05", end: "14:35" },
    { recess: true, label: "Comida" },
    { start: "16:00", end: "17:30" },
    { start: "17:30", end: "19:00" }
  ];
  const DAYS = [
    { key: "mon", label: "Lunes", dayIndex: 1 },
    { key: "tue", label: "Martes", dayIndex: 2 },
    { key: "wed", label: "Miércoles", dayIndex: 3 },
    { key: "thu", label: "Jueves", dayIndex: 4 },
    { key: "fri", label: "Viernes", dayIndex: 5 }
  ];

  function pad(n){ return String(n).padStart(2, "0"); }
  function dateKey(y, m, d){ return y + "-" + pad(m + 1) + "-" + pad(d); }

  async function syncToCloud() {
    try {
      await setDoc(docRef, window.cloudData);
    } catch (e) {
      console.error("Error al guardar en Firebase:", e);
    }
  }

  // Escuchar Cambios en Firebase
  onSnapshot(docRef, (docSnap) => {
    if (docSnap.exists()) {
      const data = docSnap.data();
      window.cloudData.tasks = data.tasks || {};
      window.cloudData.schedule = data.schedule || {};
      window.cloudData.campus = data.campus || {};
    }
    
    document.getElementById("cloudDot").classList.add("online");
    document.getElementById("cloudStatusText").textContent = "Sincronizado";

    loadScheduleInputs();
    renderCalendar();
    renderPriorityTasks();
    if (selectedDateKey) renderTaskList();
  }, (error) => {
    console.error("Error Firebase:", error);
    document.getElementById("cloudStatusText").textContent = "Error Permisos/Red";
  });

  function buildScheduleTable(){
    const tbody = document.getElementById("scheduleBody");
    let html = "";
    PERIODS.forEach((p, idx) => {
      if(p.recess){
        html += `<tr class="recess-row"><td class="time-cell">--</td><td colspan="5">${p.label}</td></tr>`;
      } else {
        let row = `<tr><td class="time-cell">${p.start} - ${p.end}</td>`;
        DAYS.forEach(d => {
          row += `<td><div class="subject-cell">
            <input type="text" class="subject-input" data-key="${d.key}-${idx}-subj" placeholder="Asignatura">
            <input type="text" class="subject-input room-input" data-key="${d.key}-${idx}-room" placeholder="Aula">
          </div></td>`;
        });
        row += "</tr>";
        html += row;
      }
    });
    tbody.innerHTML = html;
  }

  function loadScheduleInputs(){
    const data = window.cloudData.schedule || {};
    const inputs = document.querySelectorAll(".subject-input");
    inputs.forEach(inp => {
      // Evitar sobrescribir si el usuario está escribiendo en este input exactamente
      if (document.activeElement !== inp) {
        const key = inp.getAttribute("data-key");
        inp.value = data[key] || "";
      }
    });
  }

  function renderCalendar(){
    const grid = document.getElementById("daysGrid");
    grid.innerHTML = "";
    const tasks = window.cloudData.tasks || {};
    const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());

    const firstDay = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
    const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;

    for(let i = 0; i < totalCells; i++){
      let cellDay, cellMonth, cellYear, otherMonth = false;
      if(i < firstDay){
        cellDay = daysInPrevMonth - firstDay + i + 1;
        cellMonth = viewMonth - 1; cellYear = viewYear; otherMonth = true;
      } else if(i >= firstDay + daysInMonth){
        cellDay = i - (firstDay + daysInMonth) + 1;
        cellMonth = viewMonth + 1; cellYear = viewYear; otherMonth = true;
      } else {
        cellDay = i - firstDay + 1;
        cellMonth = viewMonth; cellYear = viewYear;
      }

      let normMonth = cellMonth, normYear = cellYear;
      if(normMonth < 0){ normMonth = 11; normYear -= 1; }
      if(normMonth > 11){ normMonth = 0; normYear += 1; }

      const key = dateKey(normYear, normMonth, cellDay);
      const dayTasks = tasks[key] || [];
      const pending = dayTasks.filter(t => !t.done).length;

      const cell = document.createElement("button");
      cell.className = `day-cell ${otherMonth ? "other-month" : ""} ${key === todayKey ? "is-today" : ""}`;
      cell.innerHTML = `<span class="day-num">${cellDay}</span>${pending > 0 ? '<span class="task-dot pending"></span>' : ''}`;
      cell.onclick = () => openDayModal(key);
      grid.appendChild(cell);
    }
    document.getElementById("monthTitle").textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;
  }

  function renderPriorityTasks(){
    const tasksDict = window.cloudData.tasks || {};
    const container = document.getElementById("priorityTaskList");
    let allTasks = [];

    Object.keys(tasksDict).forEach(date => {
      tasksDict[date].forEach(t => {
        if (!t.done) allTasks.push({ date, task: t });
      });
    });

    if (allTasks.length === 0) {
      container.innerHTML = '<p style="font-size:12px;color:gray;">Sin tareas pendientes</p>';
      return;
    }

    container.innerHTML = allTasks.map(item => `
      <div class="priority-item urgency-medium">
        <span style="font-size:11px;">Para ${item.date}</span>
        <div><strong>${item.task.text}</strong></div>
      </div>
    `).join("");
  }

  function openDayModal(key){
    selectedDateKey = key;
    document.getElementById("dayModalTitle").textContent = key;
    renderTaskList();
    document.getElementById("dayModalOverlay").classList.add("open");
  }

  function renderTaskList(){
    const tasks = window.cloudData.tasks[selectedDateKey] || [];
    const container = document.getElementById("taskList");
    container.innerHTML = tasks.length === 0 ? '<p style="font-size:12px;">Sin tareas para hoy.</p>' :
      tasks.map(t => `
        <div class="task-item">
          <span>${t.text}</span>
        </div>
      `).join("");
  }

  // Inicialización de Eventos DOM
  document.addEventListener("DOMContentLoaded", () => {
    buildScheduleTable();

    document.getElementById("prevBtn").onclick = () => { viewMonth--; renderCalendar(); };
    document.getElementById("nextBtn").onclick = () => { viewMonth++; renderCalendar(); };
    document.getElementById("dayModalClose").onclick = () => {
      document.getElementById("dayModalOverlay").classList.remove("open");
      selectedDateKey = null;
    };

    document.getElementById("addTaskBtn").onclick = () => {
      const input = document.getElementById("taskInput");
      if(!input.value || !selectedDateKey) return;
      if(!window.cloudData.tasks[selectedDateKey]) window.cloudData.tasks[selectedDateKey] = [];
      
      window.cloudData.tasks[selectedDateKey].push({ id: Date.now(), text: input.value, done: false });
      input.value = "";
      syncToCloud();
      renderTaskList();
      renderCalendar();
      renderPriorityTasks();
    };

    document.getElementById("scheduleBody").addEventListener("input", (e) => {
      if(e.target.matches(".subject-input")){
        const key = e.target.getAttribute("data-key");
        window.cloudData.schedule[key] = e.target.value;
        syncToCloud();
      }
    });
  });
</script>
</body>
</html>
